name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log || {
            echo "::error::$(grep -vE '^\[|Compiling|warning:|^ *[0-9]* \|' test.log | tail -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="0.0.0-dev"
          VERSION="$VERSION" ./scripts/build-app.sh
          cd build && ditto -c -k --keepParent ConvertZZ.app ConvertZZ-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ConvertZZ-macOS
          path: build/ConvertZZ-macOS.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/ConvertZZ-macOS.zip --generate-notes
