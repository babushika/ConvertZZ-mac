name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Check Dictionary.csv is up to date
        run: |
          python3 scripts/build_dictionary.py
          git diff --exit-code Resources/Dictionary.csv || { echo "::error::Resources/Dictionary.csv 與詞彙表來源不一致，請執行 scripts/build_dictionary.py"; exit 1; }
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log || {
            echo "::error::$(grep -vE '^\[|Compiling|warning:|^ *[0-9]* \|' test.log | tail -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - name: Build app
        run: |
          VERSION="$(cat VERSION)" ./scripts/build-app.sh
          cd build && ditto -c -k --keepParent ConvertZZ.app ConvertZZ-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ConvertZZ-macOS
          path: build/ConvertZZ-macOS.zip
      # 修改 VERSION 並推到 main 時，若該版本尚未發佈就自動建立標籤與 Release
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released"
          else
            gh release create "$TAG" build/ConvertZZ-macOS.zip --target "$GITHUB_SHA" --title "ConvertZZ $TAG" --generate-notes
          fi
